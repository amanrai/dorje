[project]
name = "dorje"
version = "0.2.0"
description = "Local semantic code search CLI"
readme = "README.md"
authors = [
    { name = "amanrai", email = "aman.rai25@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "apsw>=3.53.1.0",
    "certifi>=2026.4.22",
    "fastembed>=0.8.0",
    "msgpack>=1.1.2",
    "numpy>=2.4.4",
    "orjson>=3.11.9",
    "platformdirs>=4.9.6",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "sqlite-vec>=0.1.9",
    "tiktoken>=0.12.0",
    "tokenizers>=0.23.1",
    "tqdm>=4.67.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.25.1",
    "xxhash>=3.7.0",
]

[project.scripts]
dorje = "dorje.cli:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
